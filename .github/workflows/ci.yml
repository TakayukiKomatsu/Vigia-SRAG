name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --frozen --extra dev
      - name: Ruff
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy src
      - name: pytest
        run: uv run pytest
      - name: Validate SDD traceability
        run: |
          uv run python scripts/check_traceability.py .agent/specs/01-data-foundation
          uv run python scripts/check_traceability.py .agent/specs/02-epidemiological-metrics
          uv run python scripts/check_traceability.py .agent/specs/03-agentic-reporting
          uv run python scripts/check_traceability.py .agent/specs/04-governance-delivery
      - name: Validate release metadata
        run: uv run python scripts/check_release_metadata.py
      - name: Validate tracked and historical release contents
        run: |
          uv run python scripts/check_release_contents.py
          uv run python scripts/check_release_contents.py --history

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository and history with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
