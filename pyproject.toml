[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "srag-report"
version = "0.1.0"
description = "SRAG epidemiological report generator — data foundation"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.4",
    "datasus-dbc==0.1.3",
    "dbfread==2.0.7",
    "duckdb==1.5.5",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "defusedxml==0.7.1",
    "langgraph==1.2.10",
    "openai==2.50.0",
    "odfpy==1.4.1",
]
[project.scripts]
srag-report = "srag_report.cli:main"


[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "mypy==1.13.0",
    "ruff==0.8.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/srag_report"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.isort]
known-first-party = ["data", "srag_report"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
